<!doctype html><meta charset="utf-8"><pre id="out"></pre>
<iframe id="f" src="/sumi.html" style="width:1300px;height:700px"></iframe>
<script>
const out=[]; const ok=(c,m)=>out.push((c?'PASS ':'FAIL ')+m);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const f=document.getElementById('f');
const loadFrame=()=>new Promise(r=>{f.onload=()=>setTimeout(r,500); });
let w,d,$,$$;
const bind=()=>{w=f.contentWindow; d=f.contentDocument; $=s=>d.querySelector(s); $$=s=>[...d.querySelectorAll(s)];};
const key=(k,o={})=>d.dispatchEvent(new w.KeyboardEvent('keydown',Object.assign({key:k,bubbles:true,cancelable:true},o)));
const drop=(text,name)=>{ const dt=new w.DataTransfer(); dt.items.add(new w.File([text],name,{type:'text/markdown'})); w.dispatchEvent(new w.DragEvent('drop',{dataTransfer:dt,bubbles:true,cancelable:true})); return sleep(400); };
const setq=v=>{ $('#fq').value=v; $('#fq').dispatchEvent(new w.Event('input',{bubbles:true})); };
const count=()=>$('#fcount').textContent;
const hl=name=>{ const h=w.CSS.highlights.get(name); return h?h.size:-1; };
const text=()=>$$('#editor .line').map(l=>{ const s=l.querySelector('.src'); return s?s.textContent:[...l.childNodes].filter(n=>!(n.nodeType===1&&n.hasAttribute('data-x'))).map(n=>n.textContent).join(''); }).join('\n');
const src='alpha beta\n\nbeta Beta betamax\n\n| a | beta |\n|---|---|\n| beta | b |\n\nend';
(async()=>{
  await loadFrame(); bind(); w.localStorage.clear(); w.indexedDB.deleteDatabase('sumi');
  Object.defineProperty(w,'localStorage',{get(){throw new Error('blocked');}});
  f.src='/sumi.html?fresh'; await loadFrame(); bind();
  await drop(src,'t.md');
  // caret on "end" so the first match is found from the top by wrapping
  const last=$$('#editor .line').slice(-1)[0]; const r=d.createRange(); r.setStart(last.firstChild,0); r.collapse(true); const sel=w.getSelection(); sel.removeAllRanges(); sel.addRange(r); $('#editor').focus();
  key('f',{metaKey:true}); await sleep(100);
  ok($('#find').classList.contains('show')&&d.activeElement===$('#fq'),'cmd-F opens the bar and focuses the query');
  setq('beta'); await sleep(50);
  ok(count()==='1 of 6','six case-insensitive matches, table rows included: '+count());
  ok(hl('sumi-find')===5&&hl('sumi-find-current')===1,'highlights: 5 others + 1 current');
  ok(w.getSelection().toString()==='','no selection moved yet');
  $('#fnext').click(); await sleep(50);
  ok(count()==='2 of 6'&&w.getSelection().toString()==='beta'&&d.activeElement===$('#fq'),'next selects the second match, input keeps focus: '+count());
  $('#fprev').click(); $('#fprev').click(); await sleep(50);
  ok(count()==='6 of 6','previous wraps around: '+count());
  ok(!$$('#editor .line.trow').every(l=>l.classList.contains('fold')),'jumping into the table unfolds it');
  $('#fcase').click(); await sleep(50); ok(count().endsWith('of 5')&&$('#fcase').getAttribute('aria-pressed')==='true','match case: 5');
  $('#fword').click(); await sleep(50); ok(count().endsWith('of 4'),'match case + whole word: 4 (no betamax, no Beta): '+count());
  $('#fcase').click(); await sleep(50); ok(count().endsWith('of 5'),'whole word only: 5: '+count());
  $('#fword').click(); await sleep(50);
  // replace one at the first match
  $('#fq').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true})); await sleep(50);   // moves to next
  while(count()!=='1 of 6'){ $('#fnext').click(); await sleep(30); }
  $('#fr').value='gamma'; $('#frep').click(); await sleep(150);
  ok($$('#editor .line')[0].textContent==='alpha gamma'&&count()==='1 of 5','replace one rewrites the first line and moves on: '+count());
  key('z',{metaKey:true}); await sleep(150);
  ok($$('#editor .line')[0].textContent==='alpha beta'&&count()==='1 of 6','undo restores it as one step: '+count());
  // typing in the editor while the bar is open updates the count
  const l0=$$('#editor .line')[0]; const r2=d.createRange(); r2.selectNodeContents(l0); r2.collapse(false); sel.removeAllRanges(); sel.addRange(r2); $('#editor').focus(); d.execCommand('insertText',false,' beta'); await sleep(150);
  ok(count().endsWith('of 7'),'live count after typing: '+count());
  key('z',{metaKey:true}); await sleep(150);
  // replace all
  $('#fall').click(); await sleep(200);
  ok(count()==='no match'&&!/beta/i.test(text())&&/gamma Gamma gammamax/.test(text())==false&&/gamma gamma gammamax/.test(text()),'replace all: every match replaced: '+JSON.stringify(text().slice(0,40)));
  ok(/Replaced 6 matches/.test($('#toast').textContent),'toast reports the count');
  key('z',{metaKey:true}); await sleep(150);
  ok(count()==='1 of 6'||/of 6$/.test(count()),'undo brings all six back: '+count());
  key('Escape'); await sleep(50);
  ok(!$('#find').classList.contains('show')&&d.activeElement===$('#editor')&&hl('sumi-find')===-1,'Escape closes, focuses the editor, clears highlights');
  ok(w.getSelection().toString()==='beta','current match stays selected after closing');
  // cmd-G with the bar closed opens it, cmd-G again steps
  key('g',{metaKey:true}); await sleep(50); ok($('#find').classList.contains('show'),'cmd-G opens the bar');
  const before=count(); key('g',{metaKey:true}); await sleep(50); ok(count()!==before,'cmd-G steps to the next match: '+before+' -> '+count());
  key('g',{metaKey:true,shiftKey:true}); await sleep(50); ok(count()===before,'cmd-shift-G steps back');
  key('Escape');
  w.localStorage.clear();
  document.getElementById('out').textContent='RESULTS\n'+out.join('\n')+'\nDONE';
})().catch(e=>{document.getElementById('out').textContent='RESULTS\n'+out.join('\n')+'\nERROR '+e.stack;});
</script>
