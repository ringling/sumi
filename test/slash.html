<!doctype html><meta charset="utf-8"><pre id="out"></pre>
<iframe id="f" src="/sumi.html" style="width:1300px;height:700px"></iframe>
<script>
const out=[]; const ok=(c,m)=>out.push((c?'PASS ':'FAIL ')+m);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const f=document.getElementById('f');
const loadFrame=()=>new Promise(r=>{f.onload=()=>setTimeout(r,500); });
let w,d,$,$$;
const bind=()=>{w=f.contentWindow; d=f.contentDocument; $=s=>d.querySelector(s); $$=s=>[...d.querySelectorAll(s)];};
const key=(k,o={})=>d.dispatchEvent(new w.KeyboardEvent('keydown',Object.assign({key:k,bubbles:true,cancelable:true},o)));
const drop=(text,name)=>{ const dt=new w.DataTransfer(); dt.items.add(new w.File([text],name,{type:'text/markdown'})); w.dispatchEvent(new w.DragEvent('drop',{dataTransfer:dt,bubbles:true,cancelable:true})); return sleep(400); };
const real=async t=>{ const n=(window.__typed||0)+1; (window.__keys=window.__keys||[]).push(t); while((window.__typed||0)<n) await sleep(30); await sleep(150); };
const srcText=l=>{ const s=l.querySelector('.src'); return s?s.textContent:[...l.childNodes].filter(n=>!(n.nodeType===1&&n.hasAttribute('data-x'))).map(n=>n.textContent).join(''); };
const lines=()=>$$('#editor .line').map(srcText);
const caretLine=i=>{ const el=$$('#editor .line')[i]; const r=d.createRange(); r.selectNodeContents(el); r.collapse(false); const s=w.getSelection(); s.removeAllRanges(); s.addRange(r); $('#editor').focus(); d.dispatchEvent(new Event('selectionchange')); };
const caretPos=()=>{ const s=w.getSelection(); const el=(s.anchorNode.nodeType===1?s.anchorNode:s.anchorNode.parentElement).closest('.line'); const r=d.createRange(); r.selectNodeContents(el); r.setEnd(s.anchorNode,s.anchorOffset); return [$$('#editor .line').indexOf(el), r.toString().length]; };
const items=()=>$$('#slash div').map(x=>x.textContent);
const reset=async()=>{ for(let i=0;i<12&&!(lines()[1]===''&&lines().length===9);i++){ key('z',{metaKey:true}); await sleep(120); } };
(async()=>{
  await loadFrame(); bind(); w.localStorage.clear(); w.indexedDB.deleteDatabase('sumi');
  Object.defineProperty(w,'localStorage',{get(){throw new Error('blocked');}});
  f.src='/sumi.html?fresh'; await loadFrame(); bind();
  await drop(['# Top','','','a paragraph','','```','','```',''].join('\n'),'s.md');
  caretLine(1); await real('/');
  ok($('#slash').classList.contains('show')&&items().length>=20&&$$('#slash div')[0].classList.contains('on'),'/ on an empty line opens the popup: '+items().length+' items');
  ok(!items().some(t=>t.includes('Front matter')),'front matter offered only on the first line');
  await real('tab');
  ok(items().length===2&&items()[0].includes('/tableTable')&&items()[1].includes('contents'),'/tab filters to the table, then table of contents: '+items().join(' | '));
  key('Enter'); await sleep(200);
  ok(lines().slice(1,4).join('\n')==='|        |        |\n| ------ | ------ |\n|        |        |','Enter inserts the table skeleton: '+JSON.stringify(lines().slice(1,4)));
  ok(JSON.stringify(caretPos())==='[1,2]'&&!$('#slash').classList.contains('show'),'caret in the first header cell, popup closed: '+JSON.stringify(caretPos()));
  key('z',{metaKey:true}); await sleep(150);
  ok(lines()[1]==='/tab'&&lines().length===9,'one undo removes the template and leaves the typed /tab: '+JSON.stringify(lines()[1]));
  await reset(); ok(lines()[1]===''&&lines().length===9,'further undos clear the line: '+JSON.stringify(lines()[1]));
  // code block, then typing inside it does not trigger
  caretLine(1); await real('/co'); key('Enter'); await sleep(200);
  ok(lines().slice(1,4).join('\n')==='```\n\n```'&&JSON.stringify(caretPos())==='[1,3]','/co inserts a fence with the caret after the ticks for a language');
  await real('js'); await real('\n'); await real('/');
  ok(!$('#slash').classList.contains('show')&&lines()[2]==='/','no popup inside a code fence');
  await reset();
  // arrows and Tab, an alert
  caretLine(1); await real('/'); key('ArrowDown'); key('ArrowDown'); await sleep(30);
  ok($$('#slash div')[2].classList.contains('on'),'arrows move the choice');
  key('ArrowUp'); key('ArrowUp'); await real('warn'); key('Tab'); await sleep(200);
  ok(lines()[1]==='> [!WARNING]'&&lines()[2]==='> '&&JSON.stringify(caretPos())==='[2,2]','Tab inserts the warning alert with the caret on its body line');
  await reset();
  // mid-line slash is just a character; Escape closes
  caretLine(3); await real(' /');
  ok(!$('#slash').classList.contains('show')&&lines()[3]==='a paragraph /','/ mid-line is plain text');
  await real('\b\b'); await reset(); caretLine(1); await real('/'); key('Escape'); await sleep(50);
  ok(!$('#slash').classList.contains('show')&&lines()[1]==='/','Escape closes and leaves the slash');
  await real('\b'); await reset();
  // date
  caretLine(1); await real('/date'); key('Enter'); await sleep(200);
  ok(/^\d{4}-\d{2}-\d{2}$/.test(lines()[1]),'/date inserts today: '+lines()[1]);
  // mouse
  await reset();
  caretLine(1); await real('/');
  const q=$$('#slash div').find(x=>x.textContent.includes('Quote')); q.dispatchEvent(new w.MouseEvent('mousedown',{bubbles:true,cancelable:true})); await sleep(200);
  ok(lines()[1]==='> '&&JSON.stringify(caretPos())==='[1,2]','clicking an item inserts it');
  w.localStorage.clear();
  document.getElementById('out').textContent='RESULTS\n'+out.join('\n')+'\nDONE';
})().catch(e=>{document.getElementById('out').textContent='RESULTS\n'+out.join('\n')+'\nERROR '+e.stack;});
</script>
